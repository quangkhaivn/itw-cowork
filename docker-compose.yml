# Cowork Business OS — ITW
# Mục 25 đặc tả yêu cầu: frontend, backend, database, redis, worker, nginx.
# Ở đây frontend và backend gộp làm một dịch vụ `app` (Next.js phục vụ cả giao diện
# lẫn API). Lý do đã ghi trong docs/quyet-dinh-kien-truc.md — tách đôi không đem lại
# lợi ích nào mà lại vi phạm mục 30 "tạo quá nhiều module rời rạc".

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [cowork]

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [cowork]

  app:
    image: cowork-itw:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_OWNER: ${DATABASE_URL_OWNER}
      REDIS_URL: ${REDIS_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      # 0.16.0: khóa mã hóa mật khẩu SMTP + khóa TOTP, và ký liên kết huỷ nhận tin.
      APP_ENC_KEY: ${APP_ENC_KEY}
      # Trợ lý AI (Phase 9). Trước 0.16.1 ba biến này không được chuyển vào container nên trợ lý
      # trên máy thật luôn báo "chưa cấu hình" dù .env đã có khóa. Để trống = trợ lý báo chưa cấu hình.
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 0.16.1: hạn một lần gọi mô hình AI, giây (mặc định 60, trần 300).
      AI_HAN_GOI_GIAY: ${AI_HAN_GOI_GIAY:-60}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      # Tệp đính kèm nằm ngoài ảnh Docker để sống qua mỗi lần triển khai lại.
      - ./data/dinh-kem:/app/data/dinh-kem
    expose:
      - "3000"
    networks: [cowork]

  worker:
    # Dùng chung ảnh với `app` — cùng mã nguồn, chỉ khác lệnh chạy.
    # Không khai báo `build` để khỏi cài lại toàn bộ gói npm lần thứ hai.
    image: cowork-itw:latest
    restart: always
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # 0.16.0: worker gửi chiến dịch email — cần giải mã mật khẩu SMTP và dựng liên kết trong thư.
      APP_ENC_KEY: ${APP_ENC_KEY}
      APP_URL: ${APP_URL}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # 0.16.1 (QĐ-87): worker ghi nhịp vào bảng system_heartbeats mỗi phút; quá 5 phút không có nhịp
    # (vòng lặp treo, mất CSDL) thì container chuyển "unhealthy" — xem bằng `docker compose ps`.
    # Docker KHÔNG tự khởi động lại container unhealthy; màn hình Quản trị → Tự động hóa báo đỏ.
    healthcheck:
      test: ["CMD", "node_modules/.bin/tsx", "worker/kiem-tra-song.ts"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    networks: [cowork]

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # Gắn cả THƯ MỤC, không gắn một tệp: gắn một tệp thì container giữ inode cũ, nên khi
      # tệp cấu hình được thay (git archive, scp, sed -i…) nginx không thấy bản mới — đã xảy
      # ra 19/09. Thư mục nginx/ chỉ chứa cowork.conf; default.conf của ảnh gốc bị che đi.
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks: [cowork]

networks:
  cowork:
    driver: bridge
