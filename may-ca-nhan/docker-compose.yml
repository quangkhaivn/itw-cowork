# Chạy thử TGTH Cowork trên MÁY CÁ NHÂN (Windows/macOS/Linux có Docker Desktop).
# Chỉ dựng CSDL PostgreSQL 16 và Redis 7; ứng dụng Next.js và worker chạy thẳng bằng Node trên máy.
# Không dùng tệp này trên máy chủ thật — máy chủ dùng docker-compose.yml ở thư mục gốc + trien-khai.sh.
# Cổng chỉ mở cho chính máy này (127.0.0.1), dùng số lạ để không đụng PostgreSQL/Redis có sẵn.
name: tgth-cowork-may-ca-nhan

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # UTF8 + locale C: tránh lỗi tiếng Việt (DEPLOYMENT.md mục "Không có Docker").
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cowork-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - cowork-redis:/data

volumes:
  cowork-pg:
  cowork-redis:
