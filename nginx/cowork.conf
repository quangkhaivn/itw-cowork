# nginx bên trong Docker Compose.
# Lớp này KHÔNG kết thúc TLS. nginx của máy chủ (ngoài Docker) mới giữ chứng chỉ
# Let's Encrypt và proxy vào đây qua 127.0.0.1:8080.

upstream cowork_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Không để lộ phiên bản nginx.
    server_tokens off;

    location /khoe {
        access_log off;
        proxy_pass http://cowork_app/api/khoe;
    }

    location / {
        proxy_pass http://cowork_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
