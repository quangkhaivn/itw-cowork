# nginx bên trong Docker Compose.
# Lớp này KHÔNG kết thúc TLS. nginx của máy chủ (ngoài Docker) mới giữ chứng chỉ
# Let's Encrypt và proxy vào đây qua 127.0.0.1:8080.

# Phân giải tên `app` qua DNS nội bộ của Docker MỖI 10 giây, không phải một lần lúc khởi động.
# Lý do: triển khai lại thì container `app` được tạo mới và có thể nhận IP khác. Khối
# `upstream app:3000` cũ chỉ phân giải một lần, nên sau lần triển khai 19/09 nginx vẫn gửi
# vào IP cũ — lúc đó đã thuộc về container `worker` — và trả 502 cho tới khi khởi động lại.
# Dùng biến trong proxy_pass buộc nginx hỏi lại DNS theo `resolver`.
resolver 127.0.0.11 valid=10s ipv6=off;

# --- IP thật của khách (0.16.1, QĐ-90) ---------------------------------------------------
# Yêu cầu tới đây luôn đi qua nginx MÁY CHỦ (cổng 8080 chỉ mở trên 127.0.0.1), nên địa chỉ nguồn
# là cổng mạng Docker. Module realip thay $remote_addr bằng X-Real-IP do nginx máy chủ đặt — CHỈ
# khi yêu cầu đến từ các dải nội bộ dưới đây. Nhờ vậy:
#   - `limit_req` bên dưới đếm theo IP thật của khách, không gộp mọi người làm một;
#   - ứng dụng nhận X-Real-IP / X-Forwarded-For do CHÍNH lớp này đặt lại, không phải chuỗi khách gửi.
# nginx máy chủ vẫn PHẢI ghi đè `proxy_set_header X-Real-IP $remote_addr;` (DEPLOYMENT.md, "Bẫy đã gặp").
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# --- Giới hạn tốc độ ở nginx (0.16.1, QĐ-90) --------------------------------------------
# Lớp chặn trước ứng dụng: vẫn có hiệu lực khi Redis hỏng (ứng dụng khi đó chỉ đếm trong bộ nhớ
# từng tiến trình). Trần ở đây RỘNG HƠN trần của ứng dụng (đăng nhập 30 lần / 15 phút / IP; form
# 20 lần / 10 phút) — nó chỉ chặn dồn dập, luật chi tiết vẫn do ứng dụng giữ.
limit_req_zone $binary_remote_addr zone=cowork_dang_nhap:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=cowork_cong_khai:10m rate=120r/m;
# Theo dõi mở / bấm thư: proxy ảnh của Gmail tải ảnh thay cho nhiều người nhận từ ít IP, nên trần rộng.
limit_req_zone $binary_remote_addr zone=cowork_theo_doi_thu:10m rate=1200r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Không để lộ phiên bản nginx.
    server_tokens off;

    set $cowork_app app:3000;
    proxy_read_timeout 60s;

    location /khoe {
        access_log off;
        proxy_pass http://$cowork_app/api/khoe;
    }

    # Đăng nhập (mật khẩu và bước mã 2 lớp).
    location ^~ /api/dang-nhap {
        limit_req zone=cowork_dang_nhap burst=10 nodelay;
        include /etc/nginx/conf.d/cowork-proxy.inc;
    }

    location ^~ /api/cong-khai/email/ {
        limit_req zone=cowork_theo_doi_thu burst=200 nodelay;
        include /etc/nginx/conf.d/cowork-proxy.inc;
    }

    # Form công khai, webhook, huỷ nhận tin — không cần đăng nhập.
    location ^~ /api/cong-khai/ {
        limit_req zone=cowork_cong_khai burst=60 nodelay;
        include /etc/nginx/conf.d/cowork-proxy.inc;
    }

    # Trợ lý AI: một lượt hỏi có thể gọi mô hình vài vòng (mỗi vòng tối đa AI_HAN_GOI_GIAY, mặc định
    # 60 giây). Hạn đọc 60 giây của cấp server sẽ cắt ngang lượt hỏi đang chạy.
    location = /api/v1/tro-ly/hoi {
        include /etc/nginx/conf.d/cowork-proxy.inc;
        proxy_read_timeout 300s;
    }

    location / {
        include /etc/nginx/conf.d/cowork-proxy.inc;
    }
}
