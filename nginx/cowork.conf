# nginx bên trong Docker Compose.
# Lớp này KHÔNG kết thúc TLS. nginx của máy chủ (ngoài Docker) mới giữ chứng chỉ
# Let's Encrypt và proxy vào đây qua 127.0.0.1:8080.

# Phân giải tên `app` qua DNS nội bộ của Docker MỖI 10 giây, không phải một lần lúc khởi động.
# Lý do: triển khai lại thì container `app` được tạo mới và có thể nhận IP khác. Khối
# `upstream app:3000` cũ chỉ phân giải một lần, nên sau lần triển khai 19/09 nginx vẫn gửi
# vào IP cũ — lúc đó đã thuộc về container `worker` — và trả 502 cho tới khi khởi động lại.
# Dùng biến trong proxy_pass buộc nginx hỏi lại DNS theo `resolver`.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Không để lộ phiên bản nginx.
    server_tokens off;

    set $cowork_app app:3000;

    location /khoe {
        access_log off;
        proxy_pass http://$cowork_app/api/khoe;
    }

    location / {
        # Biến không kèm đường dẫn → nginx chuyển nguyên URI gốc của yêu cầu.
        proxy_pass http://$cowork_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Giữ nguyên IP thật do nginx máy chủ đặt. Ghi đè bằng $remote_addr ở đây sẽ
        # thành IP cổng Docker, và giới hạn tốc độ đăng nhập sẽ gộp mọi người làm một.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
